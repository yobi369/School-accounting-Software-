databases:
  - name: shuleledger-db
    databaseName: shuleledger
    user: shuleledger_owner
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: shuleledger
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    # Apply immutable, checksum-verified migrations, create/verify a restricted
    # runtime role, then launch the API without migration credentials in its env.
    # For a paid production service, move migrations to a separate release job.
    dockerCommand: node scripts/start-render.mjs
    initialDeployHook: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Confirm the ingress hop count before using req.ip for security decisions.
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: shuleledger-db
          property: connectionString
      - key: MIGRATIONS_DATABASE_URL
        fromDatabase:
          name: shuleledger-db
          property: connectionString
      - key: RUNTIME_DATABASE_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: PRODUCTION_READINESS_ATTESTED
        value: "false"
