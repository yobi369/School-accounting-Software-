databases:
  - name: shuleledger-db
    databaseName: shuleledger
    user: shuleledger_owner
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: shuleledger
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    initialDeployHook: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: shuleledger-db
          property: connectionString
      - key: MIGRATIONS_DATABASE_URL
        fromDatabase:
          name: shuleledger-db
          property: connectionString
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: PRODUCTION_READINESS_ATTESTED
        value: "false"
