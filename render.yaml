databases:
  - name: shuleledger-db
    databaseName: shuleledger
    user: shuleledger_owner
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: shuleledger
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    # initialDeployHook runs only once, so later schema migrations can be missing.
    # This free-tier pilot applies checksum-verified migrations before each start.
    # For production, move migrations to a separate release/pre-deploy job and
    # do not expose the migration-owner credential to the running web service.
    dockerCommand: sh -c 'node scripts/migrate.mjs && node dist-server/index.js'
    initialDeployHook: npm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Render ingress sits behind the platform proxy chain; confirm this hop count
      # against the live request path before using req.ip for security decisions.
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: shuleledger-db
          property: connectionString
      - key: MIGRATIONS_DATABASE_URL
        fromDatabase:
          name: shuleledger-db
          property: connectionString
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: PRODUCTION_READINESS_ATTESTED
        value: "false"
