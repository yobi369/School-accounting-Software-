name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shuleledger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shuleledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shuleledger_app:shuleledger_ci@localhost:5432/shuleledger
      MIGRATIONS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shuleledger
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Audit dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+' | severity='+v.severity+' | direct='+v.isDirect+' | range='+v.range+' | fix='+JSON.stringify(v.fixAvailable)+' | via='+v.via.map(x=>typeof x==='string'?x:x.title).join('; ')); const bad=Object.entries(a.vulnerabilities||{}).filter(([,v])=>['high','critical'].includes(v.severity)); if(bad.length) process.exit(1)"
      - name: Create least-privilege runtime role
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger -v ON_ERROR_STOP=1 -c "CREATE ROLE shuleledger_app LOGIN PASSWORD 'shuleledger_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;"
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Verify database backup and restore
        run: |
          pg_dump --format=custom --no-owner --no-acl --dbname "$MIGRATIONS_DATABASE_URL" --file=/tmp/shuleledger-ci.dump
          PGPASSWORD=postgres createdb -h localhost -U postgres shuleledger_restore
          pg_restore --exit-on-error --no-owner --no-acl --dbname=postgres://postgres:postgres@localhost:5432/shuleledger_restore /tmp/shuleledger-ci.dump
          diff -u <(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger -F '|' -Atc "SELECT name, checksum FROM schema_migrations ORDER BY name") <(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger_restore -F '|' -Atc "SELECT name, checksum FROM schema_migrations ORDER BY name")
          test "$(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger_restore -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('accounts','journal_entries','journal_lines','students','fee_invoices','expenses') AND c.relrowsecurity AND c.relforcerowsecurity")" -eq 6
          test "$(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger_restore -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('schema_migrations','schools','accounts','journal_entries','journal_lines','students','fee_invoices','expenses')")" -eq 8
      - name: Verify encrypted backup script and restore drill
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          age-keygen -o /tmp/shuleledger-age-identity.txt 2>/tmp/age-keygen.log
          chmod 600 /tmp/shuleledger-age-identity.txt
          recipient="$(age-keygen -y /tmp/shuleledger-age-identity.txt)"
          DATABASE_URL="$MIGRATIONS_DATABASE_URL" BACKUP_DIR=/tmp/shuleledger-backups BACKUP_AGE_RECIPIENT="$recipient" bash scripts/backup-db.sh
          backup_file="$(find /tmp/shuleledger-backups -maxdepth 1 -type f -name '*.dump.age' -print -quit)"
          test -n "$backup_file"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE shuleledger_encrypted_restore"
          BACKUP_FILE="$backup_file" RESTORE_DATABASE_URL=postgres://postgres:postgres@localhost:5432/shuleledger_encrypted_restore AGE_IDENTITY_FILE=/tmp/shuleledger-age-identity.txt CONFIRM_RESTORE_TARGET=disposable bash scripts/restore-drill.sh
          test "$(psql -h localhost -U postgres -d shuleledger_encrypted_restore -Atc "SELECT count(*) FROM schema_migrations")" -gt 0
          test "$(psql -h localhost -U postgres -d shuleledger_encrypted_restore -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='journal_entries' AND c.relrowsecurity AND c.relforcerowsecurity")" -eq 1
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test configured production deployment
        if: vars.PRODUCTION_BASE_URL != ''
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: bash scripts/smoke-deployment.sh
