name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shuleledger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shuleledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shuleledger_app:shuleledger_ci@localhost:5432/shuleledger
      MIGRATIONS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shuleledger
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Audit dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+' | severity='+v.severity+' | direct='+v.isDirect+' | range='+v.range+' | fix='+JSON.stringify(v.fixAvailable)+' | via='+v.via.map(x=>typeof x==='string'?x:x.title).join('; ')); const bad=Object.entries(a.vulnerabilities||{}).filter(([,v])=>['high','critical'].includes(v.severity)); if(bad.length) process.exit(1)"
      - name: Build third-party dependency license inventory
        run: |
          npx --yes license-checker@25.0.1 --json --out /tmp/third-party-licenses.json
          node scripts/check-license-inventory.mjs /tmp/third-party-licenses.json
      - name: Upload dependency license inventory
        uses: actions/upload-artifact@v4
        with:
          name: third-party-license-inventory
          path: /tmp/third-party-licenses.json
          if-no-files-found: error
          retention-days: 90
      - name: Create least-privilege runtime role
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger -v ON_ERROR_STOP=1 -c "CREATE ROLE shuleledger_app LOGIN PASSWORD 'shuleledger_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;"
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Verify least-privilege runtime role setup
        env:
          RUNTIME_DATABASE_PASSWORD: disposable-ci-placeholder-password-2026
          SHULELEDGER_ROLE_SETUP_ONLY: "true"
        run: node scripts/start-render.mjs
      - name: Seed synthetic accounting records for recovery verification
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO schools (id,name,code) VALUES ('10000000-0000-4000-8000-000000000001','CI Recovery Fixture School','BACKUP-CI');
          INSERT INTO users (id,email,password_hash,full_name) VALUES ('10000000-0000-4000-8000-000000000002','backup-fixture@example.test','test-hash','Backup Fixture User');
          INSERT INTO roles (id,school_id,name) VALUES ('10000000-0000-4000-8000-000000000003','10000000-0000-4000-8000-000000000001','school_admin');
          INSERT INTO school_memberships (school_id,user_id,role_id,status) VALUES ('10000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-000000000002','10000000-0000-4000-8000-000000000003','active');
          INSERT INTO financial_years (id,school_id,name,starts_on,ends_on) VALUES ('10000000-0000-4000-8000-000000000004','10000000-0000-4000-8000-000000000001','2026','2026-01-01','2026-12-31');
          INSERT INTO accounting_periods (id,school_id,financial_year_id,starts_on,ends_on) VALUES ('10000000-0000-4000-8000-000000000005','10000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-000000000004','2026-01-01','2026-12-31');
          INSERT INTO accounts (id,school_id,code,name,account_type) VALUES
            ('10000000-0000-4000-8000-000000000006','10000000-0000-4000-8000-000000000001','1000','Cash','asset'),
            ('10000000-0000-4000-8000-000000000007','10000000-0000-4000-8000-000000000001','4000','Fee income','income');
          INSERT INTO students (id,school_id,admission_number,full_name) VALUES ('10000000-0000-4000-8000-000000000008','10000000-0000-4000-8000-000000000001','RECOVERY-001','Recovery Test Student');
          INSERT INTO fee_invoices (id,school_id,student_id,invoice_number,academic_year,description,issued_on,due_on,amount,status) VALUES ('10000000-0000-4000-8000-000000000009','10000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-000000000008','RECOVERY-INV-001','2026','Term fees','2026-01-01','2026-02-01',1250.00,'issued');
          INSERT INTO fee_receipts (id,school_id,receipt_number,student_id,received_on,amount,payment_method,status) VALUES ('10000000-0000-4000-8000-00000000000a','10000000-0000-4000-8000-000000000001','RECOVERY-RCT-001','10000000-0000-4000-8000-000000000008','2026-01-15',500.00,'cash','posted');
          INSERT INTO fee_receipt_allocations (school_id,receipt_id,invoice_id,amount) VALUES ('10000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-00000000000a','10000000-0000-4000-8000-000000000009',500.00);
          INSERT INTO journal_entries (id,school_id,financial_year_id,period_id,entry_number,posting_date,description,status,source_type,created_by) VALUES ('10000000-0000-4000-8000-00000000000b','10000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-000000000004','10000000-0000-4000-8000-000000000005',1,'2026-01-15','Recovery fixture posting','draft','backup-test','10000000-0000-4000-8000-000000000002');
          INSERT INTO journal_lines (school_id,journal_entry_id,account_id,line_number,debit,credit) VALUES
            ('10000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-00000000000b','10000000-0000-4000-8000-000000000006',1,500.00,0),
            ('10000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-00000000000b','10000000-0000-4000-8000-000000000007',2,0,500.00);
          UPDATE journal_entries SET status='posted' WHERE id='10000000-0000-4000-8000-00000000000b';
          SQL
      - name: Verify database backup and restore
        run: |
          pg_dump --format=custom --no-owner --no-acl --dbname "$MIGRATIONS_DATABASE_URL" --file=/tmp/shuleledger-ci.dump
          PGPASSWORD=postgres createdb -h localhost -U postgres shuleledger_restore
          pg_restore --exit-on-error --no-owner --no-acl --dbname=postgres://postgres:postgres@localhost:5432/shuleledger_restore /tmp/shuleledger-ci.dump
          diff -u <(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger -F '|' -Atc "SELECT name, checksum FROM schema_migrations ORDER BY name") <(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger_restore -F '|' -Atc "SELECT name, checksum FROM schema_migrations ORDER BY name")
          test "$(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger_restore -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('accounts','journal_entries','journal_lines','students','fee_invoices','expenses') AND c.relrowsecurity AND c.relforcerowsecurity")" -eq 6
          test "$(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger_restore -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('schema_migrations','schools','accounts','journal_entries','journal_lines','students','fee_invoices','expenses')")" -eq 8
          diff -u <(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger -Atc "SELECT 'school='||count(*) FROM schools WHERE id='10000000-0000-4000-8000-000000000001' UNION ALL SELECT 'posted_journal='||count(*) FROM journal_entries WHERE id='10000000-0000-4000-8000-00000000000b' AND status='posted' UNION ALL SELECT 'journal_debits='||COALESCE(sum(debit),0)::text FROM journal_lines WHERE journal_entry_id='10000000-0000-4000-8000-00000000000b' UNION ALL SELECT 'receipt_allocations='||COALESCE(sum(amount),0)::text FROM fee_receipt_allocations WHERE receipt_id='10000000-0000-4000-8000-00000000000a'") <(PGPASSWORD=postgres psql -h localhost -U postgres -d shuleledger_restore -Atc "SELECT 'school='||count(*) FROM schools WHERE id='10000000-0000-4000-8000-000000000001' UNION ALL SELECT 'posted_journal='||count(*) FROM journal_entries WHERE id='10000000-0000-4000-8000-00000000000b' AND status='posted' UNION ALL SELECT 'journal_debits='||COALESCE(sum(debit),0)::text FROM journal_lines WHERE journal_entry_id='10000000-0000-4000-8000-00000000000b' UNION ALL SELECT 'receipt_allocations='||COALESCE(sum(amount),0)::text FROM fee_receipt_allocations WHERE receipt_id='10000000-0000-4000-8000-00000000000a'")
      - name: Verify encrypted backup script and restore drill
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          age-keygen -o /tmp/shuleledger-age-identity.txt 2>/tmp/age-keygen.log
          chmod 600 /tmp/shuleledger-age-identity.txt
          recipient="$(age-keygen -y /tmp/shuleledger-age-identity.txt)"
          DATABASE_URL="$MIGRATIONS_DATABASE_URL" BACKUP_DIR=/tmp/shuleledger-backups BACKUP_AGE_RECIPIENT="$recipient" bash scripts/backup-db.sh
          backup_file="$(find /tmp/shuleledger-backups -maxdepth 1 -type f -name '*.dump.age' -print -quit)"
          test -n "$backup_file"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE shuleledger_encrypted_restore"
          BACKUP_FILE="$backup_file" RESTORE_DATABASE_URL=postgres://postgres:postgres@localhost:5432/shuleledger_encrypted_restore AGE_IDENTITY_FILE=/tmp/shuleledger-age-identity.txt CONFIRM_RESTORE_TARGET=disposable bash scripts/restore-drill.sh
          test "$(psql -h localhost -U postgres -d shuleledger_encrypted_restore -Atc "SELECT count(*) FROM schema_migrations")" -gt 0
          test "$(psql -h localhost -U postgres -d shuleledger_encrypted_restore -Atc "SELECT count(*) FROM journal_entries WHERE id='10000000-0000-4000-8000-00000000000b' AND status='posted'")" -eq 1
          test "$(psql -h localhost -U postgres -d shuleledger_encrypted_restore -Atc "SELECT COALESCE(sum(amount),0) FROM fee_receipt_allocations WHERE receipt_id='10000000-0000-4000-8000-00000000000a'")" = "500.00"
          test "$(psql -h localhost -U postgres -d shuleledger_encrypted_restore -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='journal_entries' AND c.relrowsecurity AND c.relforcerowsecurity")" -eq 1
      - name: Validate operational shell scripts
        run: bash -n scripts/backup-db.sh scripts/restore-drill.sh scripts/smoke-deployment.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate local Docker Compose configuration
        run: docker compose --env-file .env.local.example config --quiet
      - name: Build application container
        run: docker build --tag shuleledger:ci-smoke .
      - name: Boot local Compose stack and smoke-test API
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --env-file .env.local.example down -v --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose --env-file .env.local.example up -d --build
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/ready >/tmp/shuleledger-ready.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --env-file .env.local.example ps
            docker compose --env-file .env.local.example logs --no-color --tail=200 db migrate app
            exit 1
          fi
          grep -q '"status":"ready"' /tmp/shuleledger-ready.json
          curl --fail --silent http://127.0.0.1:3001/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:3001/api/v1/status | grep -q '"databaseConfigured":true'
          curl --fail --silent http://127.0.0.1:3001/api/v1/status | grep -q '"productionReady":false'
          token='replace-with-a-long-random-one-time-setup-token'
          first_code="$(curl --silent --show-error -o /tmp/shuleledger-bootstrap.json -w '%{http_code}' -X POST http://127.0.0.1:3001/api/v1/auth/bootstrap -H "x-bootstrap-token: $token" -H 'Content-Type: application/json' --data '{"schoolName":"CI Smoke School","schoolCode":"CI-SMOKE","fullName":"CI Test Administrator","email":"ci-admin@example.test","password":"CI-only-test-password-2026!"}')"
          if [ "$first_code" != "201" ] || ! grep -q '"created":true' /tmp/shuleledger-bootstrap.json; then
            echo "First-school bootstrap failed: HTTP $first_code"
            cat /tmp/shuleledger-bootstrap.json
            docker compose --env-file .env.local.example logs --no-color --tail=100 app
            exit 1
          fi
          school_id="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/shuleledger-bootstrap.json','utf8')).schoolId)")"
          second_code="$(curl --silent --show-error -o /tmp/shuleledger-bootstrap-second.json -w '%{http_code}' -X POST http://127.0.0.1:3001/api/v1/auth/bootstrap -H "x-bootstrap-token: $token" -H 'Content-Type: application/json' --data '{"schoolName":"Second CI School","schoolCode":"CI-SMOKE-2","fullName":"Second Administrator","email":"second-admin@example.test","password":"CI-only-test-password-2026!"}')"
          if [ "$second_code" != "409" ] || ! grep -q 'Initial school setup has already been completed' /tmp/shuleledger-bootstrap-second.json; then
            echo "Second bootstrap was not safely rejected: HTTP $second_code"
            cat /tmp/shuleledger-bootstrap-second.json
            exit 1
          fi
          login_code="$(curl --silent --show-error -o /tmp/shuleledger-login.json -w '%{http_code}' -X POST http://127.0.0.1:3001/api/v1/auth/login -H 'Content-Type: application/json' --data "{\"schoolId\":\"$school_id\",\"email\":\"ci-admin@example.test\",\"password\":\"CI-only-test-password-2026!\"}")"
          if [ "$login_code" != "200" ] || ! grep -q '"mustChangePassword":true' /tmp/shuleledger-login.json; then
            echo "First administrator login failed: HTTP $login_code"
            cat /tmp/shuleledger-login.json
            docker compose --env-file .env.local.example logs --no-color --tail=100 app
            exit 1
          fi
          docker compose --env-file .env.local.example logs --no-color --tail=100 migrate app
      - name: Smoke-test configured production deployment
        if: vars.PRODUCTION_BASE_URL != ''
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: bash scripts/smoke-deployment.sh
