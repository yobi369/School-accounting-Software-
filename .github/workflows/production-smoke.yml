name: Production smoke test
on:
  # Run against the hosted service after every main update so a green build
  # cannot silently leave the deployed app broken.
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shuleledger-production-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify live deployment
        env:
          PRODUCTION_BASE_URL: https://shuleledger.onrender.com
          REQUIRE_PRODUCTION_ATTESTATION: 'false'
        run: bash scripts/smoke-deployment.sh
